<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Le petit Abel apprend le piano</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a6fd8">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7313613931904605" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-a: #fff6e9;
    --sky-b: #ffe9d6;
    --ink: #3a2e5c;
    --ink-soft: #6b5f94;
    --card: #ffffff;
    --card-line: #f0e6ff;
    --shadow: rgba(90, 60, 130, 0.18);
    --vert-ok: #43a047;
    --rouge-non: #e53935;

    --do:   #ef5350;
    --re:   #ff9e43;
    --mi:   #ffd23f;
    --fa:   #66c46b;
    --sol:  #4bb8e6;
    --la:   #6a6fd8;
    --si:   #b36bd4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-a: #221a3d; --sky-b: #2c2154; --ink: #f3eeff; --ink-soft: #cabdf0;
      --card: #2f2555; --card-line: #4a3c86; --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --sky-a: #221a3d; --sky-b: #2c2154; --ink: #f3eeff; --ink-soft: #cabdf0;
    --card: #2f2555; --card-line: #4a3c86; --shadow: rgba(0,0,0,0.4);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: 'Quicksand', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
    min-height: 100vh;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
    overflow-x: hidden;
  }
  .app{ width:100%; max-width: 760px; }

  /* ---------- Abel + bulle ---------- */
  .zone-abel{
    display:flex;
    align-items:flex-end;
    gap: 12px;
    margin-bottom: 14px;
  }
  .abel-svg{ flex-shrink:0; filter: drop-shadow(0 6px 10px var(--shadow)); }
  .bulle{
    position:relative;
    background: var(--card);
    border: 2px solid var(--card-line);
    border-radius: 20px;
    padding: 12px 16px;
    flex:1;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    box-shadow: 0 8px 18px var(--shadow);
    min-height: 20px;
  }
  .bulle::before{
    content:'';
    position:absolute;
    left: -8px; bottom: 16px;
    width: 16px; height:16px;
    background: var(--card);
    border-left: 2px solid var(--card-line);
    border-bottom: 2px solid var(--card-line);
    transform: rotate(45deg);
  }
  .mute-btn{
    background: var(--card);
    border: 2px solid var(--card-line);
    border-radius: 50%;
    width:40px; height:40px;
    font-size:16px;
    cursor:pointer;
    box-shadow: 0 4px 10px var(--shadow);
    flex-shrink:0;
    align-self: flex-start;
  }

  header{ text-align:center; margin-bottom: 6px; }
  .titre{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size: clamp(22px, 5.4vw, 32px);
    margin: 0 0 14px;
  }

  .onglets{
    display:flex;
    gap:8px;
    justify-content:center;
    margin: 4px 0 20px;
    flex-wrap: wrap;
  }
  .onglet{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 13px;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--card-line);
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    box-shadow: 0 4px 10px var(--shadow);
  }
  .onglet.actif{
    color:#fff;
    background: linear-gradient(135deg, var(--la), var(--sol));
    border-color: transparent;
  }

  .panneau{ display:none; }
  .panneau.actif{ display:block; }

  .carte{
    background: var(--card);
    border-radius: 26px;
    padding: 22px 18px 26px;
    box-shadow: 0 20px 40px var(--shadow);
    border: 2px solid var(--card-line);
  }

  .clavier{
    display:flex;
    gap: 7px;
    justify-content:center;
    align-items:flex-end;
  }
  .touche{
    flex: 1 1 0;
    max-width: 74px;
    height: 140px;
    border: none;
    border-radius: 14px 14px 20px 20px;
    color: #fff;
    font-family:'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 14px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 12px;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.18), 0 10px 18px var(--shadow);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .touche:active, .touche.appuyee{
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 4px 10px var(--shadow);
    filter: brightness(1.18);
  }
  .touche.cible::after{
    content:'👆';
    position:absolute;
    top:-30px; left:50%; transform: translateX(-50%);
    font-size: 20px;
    animation: rebondit 0.9s infinite;
  }
  @keyframes rebondit{ 0%,100%{ transform: translateX(-50%) translateY(0);} 50%{ transform: translateX(-50%) translateY(-6px);} }

  .touche.do{ background: linear-gradient(180deg, #ff8a87, var(--do)); }
  .touche.re{ background: linear-gradient(180deg, #ffb96f, var(--re)); }
  .touche.mi{ background: linear-gradient(180deg, #ffe082, var(--mi)); color:#5c4a00; }
  .touche.fa{ background: linear-gradient(180deg, #8fdb93, var(--fa)); }
  .touche.sol{ background: linear-gradient(180deg, #7fd0f2, var(--sol)); }
  .touche.la{ background: linear-gradient(180deg, #9498e8, var(--la)); }
  .touche.si{ background: linear-gradient(180deg, #d195e8, var(--si)); }

  .regle{
    text-align:center;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 13px;
    margin: 18px 0 0;
    line-height: 1.5;
  }

  .jeu-en-tete{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; }
  .stat{ text-align:center; }
  .stat .valeur{ font-family:'Fredoka', sans-serif; font-weight:700; font-size: 22px; color: var(--ink); }
  .stat .label{ font-size: 11px; color: var(--ink-soft); font-weight: 600; }
  .message-jeu{ text-align:center; font-family:'Fredoka', sans-serif; font-weight: 600; font-size: 16px; min-height: 24px; margin-bottom: 10px; }
  .bouton-jeu{
    display:block; margin: 16px auto 0; font-family:'Fredoka', sans-serif; font-weight: 700; font-size: 14px;
    color: #fff; background: linear-gradient(135deg, var(--fa), var(--sol)); border: none; border-radius: 14px;
    padding: 11px 24px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .bouton-jeu:active{ transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }

  /* ---------- Quiz ---------- */
  .quiz-progression{ display:flex; gap:5px; justify-content:center; margin-bottom: 16px; }
  .puce{ width: 10px; height:10px; border-radius:50%; background: var(--card-line); }
  .puce.faite{ background: var(--fa); }
  .puce.ratee{ background: var(--rouge-non); }
  .quiz-chrono-piste{ width: 220px; height: 16px; border-radius:10px; background: var(--card-line); margin: 0 auto 10px; overflow:hidden; }
  .quiz-chrono-barre{ height:100%; border-radius:10px; background: linear-gradient(90deg, var(--fa), var(--mi)); transition: width 1s linear, background-color 0.3s; }
  .quiz-chrono-nombre{ text-align:center; font-family:'Fredoka', sans-serif; font-weight:700; font-size:22px; color: var(--ink); margin-bottom: 14px; }
  .quiz-question{
    font-family:'Fredoka', sans-serif; font-weight:700; font-size: 18px; text-align:center; margin-bottom: 18px;
  }
  .quiz-options{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-opt{
    font-family:'Quicksand', sans-serif; font-weight: 700; font-size: 15px; color:#fff;
    background: linear-gradient(135deg, #8b93f0, #6a6fd8); border:none; border-radius: 14px; padding: 16px 10px;
    cursor:pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
  }
  .quiz-opt:active{ transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .quiz-opt.bonne{ background: linear-gradient(135deg, #66bb6a, var(--vert-ok)) !important; }
  .quiz-feedback{ text-align:center; font-family:'Fredoka', sans-serif; font-weight:700; font-size:20px; margin: 10px 0; min-height: 26px; }
  .quiz-feedback.ok{ color: var(--vert-ok); }
  .quiz-feedback.non{ color: var(--rouge-non); }
  .quiz-explication{ text-align:center; font-size:14px; color: var(--ink-soft); margin: -4px 0 10px; padding: 0 8px; }
  .quiz-explication.visible{ background: var(--sky-a); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
  .mode-tranquille-toggle{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; color:var(--ink-soft); font-weight:700; margin: 10px 0 4px; cursor:pointer; }
  .mode-tranquille-toggle input{ width:16px; height:16px; }
  .quiz-opt.mauvaise{ background: linear-gradient(135deg, #ef5350, var(--rouge-non)) !important; }
  .quiz-opt[disabled]{ cursor: default; }
  .quiz-fin{ text-align:center; }
  .quiz-fin .score{ font-family:'Fredoka', sans-serif; font-weight:700; font-size: 30px; margin: 10px 0; }

  /* ---------- Partitions ---------- */
  .liste-chansons{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom: 18px; }
  .chanson-btn{
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:13px; color: var(--ink);
    background: var(--sky-a); border: 2px solid var(--card-line); border-radius: 999px; padding: 8px 16px; cursor:pointer;
  }
  .chanson-btn.actif{ color:#fff; background: linear-gradient(135deg, var(--re), var(--mi)); border-color:transparent; }
  .partition-ligne{
    display:flex; gap: 6px; overflow-x:auto; padding: 6px 4px 14px;
    scroll-behavior: smooth;
  }
  .note-bulle{
    flex-shrink:0; width: 40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka', sans-serif; font-weight:700; font-size:12px; color:#fff; opacity:0.55; transition: all 0.2s;
    border: 3px solid transparent;
  }
  .note-bulle.faite{ opacity: 1; }
  .note-bulle.courante{ opacity:1; transform: scale(1.25); border-color: var(--ink); }
  .note-bulle.do{ background:var(--do);} .note-bulle.re{ background:var(--re);} .note-bulle.mi{ background:var(--mi); color:#5c4a00;}
  .note-bulle.fa{ background:var(--fa);} .note-bulle.sol{ background:var(--sol);} .note-bulle.la{ background:var(--la);} .note-bulle.si{ background:var(--si);}
  .partition-progres{ text-align:center; font-weight:700; color: var(--ink-soft); font-size:13px; margin-bottom: 14px; }

  .etincelle{ position: fixed; font-size: 22px; pointer-events:none; animation: monteEtDisparait 0.7s ease-out forwards; z-index: 500; }
  @keyframes monteEtDisparait{ 0%{ opacity:1; transform: translateY(0) scale(0.8);} 100%{ opacity:0; transform: translateY(-50px) scale(1.3);} }

  .hidden{ display:none !important; }

  .splash-intro{
    position: fixed; inset: 0; z-index: 5000;
    background: linear-gradient(180deg, var(--sky-a), var(--sky-b));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 16px;
    transition: opacity 0.5s ease, visibility 0.5s;
    cursor: pointer;
  }
  .splash-intro.masque{ opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-abel{ animation: rebondSplash 1.1s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rebondSplash{
    0%{ transform: translateY(70px) scale(0.6); opacity:0; }
    60%{ transform: translateY(-12px) scale(1.08); opacity:1; }
    100%{ transform: translateY(0) scale(1); }
  }
  .splash-titre{
    font-family:'Fredoka', sans-serif; font-weight:700; font-size: clamp(19px, 5vw, 28px);
    color: var(--ink); text-align:center; opacity:0; padding:0 20px;
    animation: apparaitSplash 0.6s ease-out 0.95s forwards;
  }
  @keyframes apparaitSplash{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  .splash-touches{ display:flex; gap:6px; }
  .splash-touche{ width:18px; height:52px; border-radius:6px; opacity:0; transform-origin:bottom; animation: popSplash 0.4s ease-out forwards; }
  @keyframes popSplash{ from{ transform:scaleY(0.15); opacity:0;} to{ transform:scaleY(1); opacity:1;} }
  .splash-touche.do{ background:var(--do); animation-delay:1.05s; }
  .splash-touche.re{ background:var(--re); animation-delay:1.12s; }
  .splash-touche.mi{ background:var(--mi); animation-delay:1.19s; }
  .splash-touche.fa{ background:var(--fa); animation-delay:1.26s; }
  .splash-touche.sol{ background:var(--sol); animation-delay:1.33s; }
  .splash-touche.la{ background:var(--la); animation-delay:1.40s; }
  .splash-touche.si{ background:var(--si); animation-delay:1.47s; }
  .splash-toucher{
    position:absolute; bottom: 26px;
    font-family:'Fredoka', sans-serif; color:#fff; font-size:14px; font-weight:700;
    background: linear-gradient(135deg, var(--fa), var(--sol));
    border: none; border-radius: 999px; padding: 12px 26px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    opacity:0; animation: apparaitSplash 0.5s ease-out 1.9s forwards;
  }
  .splash-toucher:active{ transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .splash-chargement{ opacity:0; animation: apparaitSplash 0.5s ease-out 0.85s forwards; text-align:center; }
  .splash-barre-track{
    width: 200px; height: 12px; border-radius: 10px; background: var(--card-line); overflow:hidden; margin: 4px auto 0;
  }
  .splash-barre-fill{
    height:100%; width:0%; border-radius:10px;
    background: linear-gradient(90deg, var(--la), var(--sol));
  }
  .splash-pourcentage{ font-family:'Fredoka', sans-serif; font-weight:700; font-size:13px; color: var(--ink-soft); margin-top:6px; }

  .badges-grille{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .progression-ligne{ display:flex; justify-content:space-between; align-items:center; padding:6px 4px; font-size:14px; color:var(--ink); border-bottom:1px solid var(--card-line); }
  .progression-ligne:last-of-type{ border-bottom:none; }
  .badge-carte{
    display:flex; align-items:center; gap:10px; padding: 12px; border-radius: 16px;
    background: var(--sky-a); border: 2px solid var(--card-line); opacity: 0.5; filter: grayscale(1);
  }
  .badge-carte.obtenu{ opacity: 1; filter: none; background: linear-gradient(135deg, #fff8ea, #ffffff); border-color: #ffd23f; }
  .badge-icone{ font-size: 26px; flex-shrink:0; }
  .badge-nom{ font-family:'Fredoka', sans-serif; font-weight:700; font-size: 13px; color: var(--ink); }
  .badge-desc{ font-size: 11px; color: var(--ink-soft); font-weight:600; }

  @media (max-width: 420px){ .badges-grille{ grid-template-columns: 1fr; } }

  footer{ text-align:center; margin-top: 22px; color: var(--ink-soft); font-size: 12px; font-weight: 600; }

  @media (max-width: 420px){
    .touche{ height: 112px; font-size: 11px; }
    .quiz-options{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="splash-intro" id="splashIntro">
    <svg class="splash-abel" width="100" height="112" viewBox="0 0 120 140">
      <ellipse cx="60" cy="128" rx="34" ry="10" fill="rgba(0,0,0,0.08)"/>
      <path d="M28 138 L28 100 Q28 82 60 82 Q92 82 92 100 L92 138 Z" fill="#4bb8e6"/>
      <path d="M28 138 L28 110 Q40 122 60 122 Q80 122 92 110 L92 138 Z" fill="#3aa0d6"/>
      <circle cx="60" cy="52" r="34" fill="#f5c99b"/>
      <path d="M26 48 Q26 14 60 14 Q94 14 94 48 Q88 32 60 30 Q32 32 26 48 Z" fill="#5b3d2b"/>
      <circle cx="46" cy="54" r="5" fill="#3a2e5c"/>
      <circle cx="74" cy="54" r="5" fill="#3a2e5c"/>
      <ellipse cx="38" cy="64" rx="6" ry="4" fill="#ff9e9e" opacity="0.7"/>
      <ellipse cx="82" cy="64" rx="6" ry="4" fill="#ff9e9e" opacity="0.7"/>
      <path d="M46 68 Q60 84 74 68" stroke="#5c4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <p class="splash-titre">Le petit Abel apprend le piano</p>
    <div class="splash-touches">
      <div class="splash-touche do"></div>
      <div class="splash-touche re"></div>
      <div class="splash-touche mi"></div>
      <div class="splash-touche fa"></div>
      <div class="splash-touche sol"></div>
      <div class="splash-touche la"></div>
      <div class="splash-touche si"></div>
    </div>
    <div class="splash-chargement">
      <div class="splash-barre-track"><div class="splash-barre-fill" id="splashBarreFill"></div></div>
      <p class="splash-pourcentage" id="splashPourcentage">0%</p>
    </div>
    <button class="splash-toucher" id="btnSplashToucher">Touche l'écran pour commencer</button>
  </div>
  <div class="zone-abel">
    <svg class="abel-svg" width="64" height="72" viewBox="0 0 120 140">
      <ellipse cx="60" cy="128" rx="34" ry="10" fill="rgba(0,0,0,0.08)"/>
      <path d="M28 138 L28 100 Q28 82 60 82 Q92 82 92 100 L92 138 Z" fill="#4bb8e6"/>
      <path d="M28 138 L28 110 Q40 122 60 122 Q80 122 92 110 L92 138 Z" fill="#3aa0d6"/>
      <circle cx="60" cy="52" r="34" fill="#f5c99b"/>
      <path d="M26 48 Q26 14 60 14 Q94 14 94 48 Q88 32 60 30 Q32 32 26 48 Z" fill="#5b3d2b"/>
      <circle cx="46" cy="54" r="5" fill="#3a2e5c"/>
      <circle cx="74" cy="54" r="5" fill="#3a2e5c"/>
      <ellipse cx="38" cy="64" rx="6" ry="4" fill="#ff9e9e" opacity="0.7"/>
      <ellipse cx="82" cy="64" rx="6" ry="4" fill="#ff9e9e" opacity="0.7"/>
      <path d="M46 70 Q60 82 74 70" stroke="#5c4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bulle" id="bulle"></div>
    <button class="mute-btn" id="btnRetour" title="Retour à l'accueil" onclick="allerA('quiz')" style="margin-right:-2px;">⬅️</button>
    <button class="mute-btn" id="btnMute" title="Couper le son">🔊</button>
  </div>

  <header>
    <h1 class="titre">Le petit Abel apprend le piano</h1>
    <p id="dateJour" style="text-align:center; color:var(--ink-soft); font-weight:700; font-size:12px; margin:-8px 0 14px;"></p>
  </header>

  <div class="onglets">
    <button class="onglet actif" data-p="quiz" onclick="allerA('quiz')">📖 Quiz</button>
    <button class="onglet" data-p="cles" onclick="allerA('cles')">🎼 Étude des clés</button>
    <button class="onglet" data-p="partitions" onclick="allerA('partitions')">🎵 Partitions</button>
    <button class="onglet" data-p="badges" onclick="allerA('badges')">🏅 Badges</button>
  </div>

  <!-- QUIZ -->
  <div class="panneau actif" id="panneau-quiz">
    <div class="carte" id="carteQuiz"></div>
  </div>

  <!-- ÉTUDE DES CLÉS -->
  <div class="panneau" id="panneau-cles">
    <div class="carte" id="carteCles"></div>
  </div>

  <!-- PARTITIONS -->
  <div class="panneau" id="panneau-partitions">
    <div class="liste-chansons" id="listeChansons"></div>
    <div id="recordChansonActuelle" style="text-align:center; font-weight:700; color:var(--ink-soft); font-size:13px; margin-bottom:14px;"></div>

    <div class="carte" id="zoneMainDroitePartition" style="margin-bottom:14px;">
      <p class="regle" style="margin-top:0; font-weight:700; color:var(--ink);">🖐️ Main droite</p>
      <div class="partition-progres" id="partitionProgresA">Note 0 / 0</div>
      <div class="zone-scroll-portee" id="zonePorteePartitionA" style="overflow-x:auto; margin-bottom:10px;"></div>
      <div class="partition-ligne" id="partitionLigneA"></div>
      <div class="clavier" id="clavierPartitionA" style="margin-top:16px;"></div>
    </div>

    <div class="carte" id="zoneMainGauchePartition" style="margin-bottom:14px;">
      <p class="regle" style="margin-top:0; font-weight:700; color:var(--ink);">✋ Main gauche</p>
      <div class="partition-progres" id="partitionProgresB">Note 0 / 0</div>
      <div class="zone-scroll-portee" id="zonePorteePartitionB" style="overflow-x:auto; margin-bottom:10px;"></div>
      <div class="partition-ligne" id="partitionLigneB"></div>

let sonCoupe = false;

function obtenirContexte(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function jouerNote(freq){
  if(sonCoupe) return;
  const ctx = obtenirContexte();
  const t = ctx.currentTime;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.28, t + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
  gain.connect(ctx.destination);
  const osc1 = ctx.createOscillator(); osc1.type='sine'; osc1.frequency.value=freq; osc1.connect(gain);
  const osc2 = ctx.createOscillator(); osc2.type='triangle'; osc2.frequency.value=freq*2;
  const gain2 = ctx.createGain(); gain2.gain.value=0.06; osc2.connect(gain2); gain2.connect(ctx.destination);
  osc1.start(t); osc2.start(t); osc1.stop(t+0.9); osc2.stop(t+0.9);
}

/* ===================== ABEL : VOIX + BULLE ===================== */
let voixFR = null;
let derniereUtterance = null; // iOS/Safari coupe la voix si l'objet est "ramassé" par le garbage collector : on le garde en mémoire
let generationVoix = 0; // incrémenté à chaque nouvelle prise de parole ou coupure volontaire : une prise de parole
                         // "périmée" (dont le numéro ne correspond plus) s'arrête net, sans dépendre du timing des événements du navigateur.
function annulerVoixAbel(){
  generationVoix++;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}
const estIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

if('speechSynthesis' in window){
  function chargerVoix(){
    const voix = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    // On cherche une voix française masculine reconnaissable par son nom (ex : Thomas, Paul, Nicolas...)
    const prenomsMasculins = ['thomas','paul','nicolas','antoine','daniel','louis','henri','guillaume','pierre','male','homme'];
    voixFR = voix.find(v => prenomsMasculins.some(p => v.name.toLowerCase().includes(p))) || voix[0] || null;
  }
  chargerVoix();
  window.speechSynthesis.onvoiceschanged = chargerVoix;
}

const estAndroid = /Android/i.test(navigator.userAgent);

// Anti-coupure Chrome/Android : la synthèse vocale s'arrête parfois seule après ~14s.
// IMPORTANT : ce mécanisme casse la voix sur iOS (pause()/resume() y est bogué), donc on ne l'active JAMAIS sur iOS.
// IMPORTANT : sur Android, pause() se comporte comme cancel() sur de nombreux appareils/navigateurs,
// donc ce "réveil" coupe en réalité la voix au lieu de la sauver. On ne l'active pas non plus sur Android :
// on évite le bug autrement, en découpant le texte en phrases courtes (voir parlerAbel).
let gardienVocal = null;
function demarrerGardienVocal(){
  if(estIOS || estAndroid || gardienVocal) return;
  gardienVocal = setInterval(() => {
    if(window.speechSynthesis.speaking){
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    } else {
      clearInterval(gardienVocal);
      gardienVocal = null;
    }
  }, 4000);
}

// Découpe un texte en phrases courtes (sur la ponctuation) : chaque phrase individuelle
// reste sous le seuil qui déclenche le bug de coupure Android, donc pas besoin de pause()/resume().
function decouperEnPhrases(texte){
  const morceaux = texte.match(/[^.!?]+[.!?]*/g) || [texte];
  return morceaux.map(m => m.trim()).filter(m => m.length > 0);
}

function parlerAbel(texte, alaFin, texteAffiche){
  const bulle = document.getElementById('bulle');
  bulle.textContent = texteAffiche || texte;
  if(sonCoupe || !('speechSynthesis' in window)){
    if(alaFin) alaFin();
    return;
  }
  if(!voixFR){
    // Sur iOS, les voix arrivent parfois en retard : on retente juste avant de parler
    const voix = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if(voix.length) voixFR = voix[0];
  }

  // Sur Android, on parle phrase par phrase (enchaînées via onend) pour rester sous le seuil de coupure.
  // Ailleurs (iOS/desktop), on garde une seule utterance : la phrase en cours n'est jamais coupée.
  const phrases = estAndroid ? decouperEnPhrases(texte) : [texte];
  let index = 0;
  generationVoix++;
  const maGeneration = generationVoix; // identifie cette prise de parole précise

  function parlerSuivant(){
    // Une nouvelle prise de parole a démarré depuis (ex : réponse donnée, question suivante) :
    // celle-ci est périmée, on arrête tout sans appeler alaFin.
    if(maGeneration !== generationVoix) return;
    if(index >= phrases.length){
      if(alaFin) alaFin();
      return;
    }
    const u = new SpeechSynthesisUtterance(phrases[index]);
    u.lang = 'fr-FR';
    u.rate = 0.88;
    u.pitch = 1.4;
    if(voixFR) u.voice = voixFR;
    index++;
    u.onend = parlerSuivant;
    u.onerror = parlerSuivant;
    derniereUtterance = u; // référence conservée volontairement (bug iOS)
    window.speechSynthesis.speak(u);
  }

  parlerSuivant();
  demarrerGardienVocal();
}

function optNote(classe, estBonne){
  const n = NOTES[indexParClasse(classe)];
  return { t:n.nom, c:classe, ok:estBonne };
}

// Pour les questions "2 notes sur la portée" (niveau difficile du mode dédié) :
// des options combinant deux notes, ex. "Do et Sol".
function optPaire(classeA, classeB, estBonne){
  const nomA = NOTES[indexParClasse(classeA)].nom, nomB = NOTES[indexParClasse(classeB)].nom;
  return { t: nomA + ' et ' + nomB, ok: estBonne };
}

const NB_QUESTIONS_QUIZ = 6;
let quizQuestions = [], quizIndex = 0, quizScore = 0, quizResultats = [], quizDemarre = false, quizNiveau = 'facile';

function melanger(tableau){
  const copie = tableau.slice();
  for(let i = copie.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [copie[i], copie[j]] = [copie[j], copie[i]];
  }
  return copie;
}

const LABELS_NIVEAU = {
  facile:'🌱 Facile', moyen:'⭐ Moyen', fort:'🔥 Fort',
  cles_facile:'🌱 Clé de sol', cles_moyen:'⭐ Clé de fa', cles_fort:'🔥 2 notes'
};
// Mode spécial : uniquement les questions de lecture de notes sur la portée (clé de sol et clé de fa).
// On reprend toutes les questions qui ont une propriété "portee", quel que soit leur niveau d'origine,
// et on les fait toutes passer (7 en clé de sol + 7 en clé de fa) pour bien couvrir les deux clés.
const NB_QUESTIONS_NIVEAU = {
  facile: NB_QUESTIONS_QUIZ, moyen: NB_QUESTIONS_QUIZ, fort: NB_QUESTIONS_QUIZ,
  cles_facile: 7, cles_moyen: 7, cles_fort: 8
};

let quizRecords = { facile:0, moyen:0, fort:0, cles_facile:0, cles_moyen:0, cles_fort:0 };
try{ quizRecords = Object.assign(quizRecords, JSON.parse(localStorage.getItem('abel_quiz_records') || '{}')); }catch(e){}

let cibleQuizId = 'carteQuiz'; // conteneur actuellement utilisé par le moteur de quiz : 'carteQuiz' (onglet Quiz) ou 'carteCles' (onglet Étude des clés)

function afficherAccueilQuiz(){
  quizDemarre = false;
  cibleQuizId = 'carteQuiz';
  const ligneRecord = (niveau) => quizRecords[niveau] > 0 ? ` (record : ${quizRecords[niveau]}/${NB_QUESTIONS_NIVEAU[niveau]})` : '';
  document.getElementById('carteQuiz').innerHTML = `

      <p style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;">🎵 Petit quiz de théorie musicale</p>

      <button class="bouton-jeu" onclick="demarrerQuiz('facile')">🌱 Facile${ligneRecord('facile')}</button>
      <button class="bouton-jeu" style="background:linear-gradient(135deg, var(--re), var(--mi));" onclick="demarrerQuiz('moyen')">⭐ Moyen${ligneRecord('moyen')}</button>
      <button class="bouton-jeu" style="background:linear-gradient(135deg, var(--la), var(--si));" onclick="demarrerQuiz('fort')">🔥 Fort${ligneRecord('fort')}</button>
    </div>`;
  parlerAbel('Choisis un niveau : facile, moyen, ou fort !');
}

let modeTranquilleCles = false; // mode sans chronomètre, réservé à l'Étude des clés

      <button class="bouton-jeu" style="background:linear-gradient(135deg, var(--la), var(--si));" onclick="demarrerQuiz('cles_fort')">🔥 2 notes (sol et fa)${ligneRecord('cles_fort')}</button>

function demarrerQuiz(niveau){
  quizNiveau = niveau;
  cibleQuizId = niveau.startsWith('cles_') ? 'carteCles' : 'carteQuiz';
  // On vide l'autre conteneur pour éviter que deux écrans (Quiz et Étude des clés) partagent
  // les mêmes id (quizFeedback, zoneSuivantQuiz...) en même temps dans le document.
  const autreId = (cibleQuizId === 'carteCles') ? 'carteQuiz' : 'carteCles';
  const autreConteneur = document.getElementById(autreId);
  if(autreConteneur) autreConteneur.innerHTML = '';

  const banque = niveau.startsWith('cles_')
    ? BANQUE_QUIZ.filter(q => q.niveauCles === niveau.replace('cles_', ''))
    : BANQUE_QUIZ.filter(q => q.niveau === niveau);
  const nb = NB_QUESTIONS_NIVEAU[niveau] || NB_QUESTIONS_QUIZ;
  quizQuestions = melanger(banque).slice(0, Math.min(nb, banque.length));
  quizIndex = 0; quizScore = 0; quizResultats = []; quizDemarre = true;
  parlerAbel(niveau.startsWith('cles_') ? 'C\'est parti pour lire les notes sur la portée !' : 'C\'est parti pour le niveau ' + niveau + ' !');
  afficherQuestionQuiz();
}

let intervalleChronoQuiz = null;
const DUREE_CHRONO_QUIZ = 10; // durée du chrono du quiz, en secondes

function arreterChronoQuiz(){
  if(intervalleChronoQuiz){ clearInterval(intervalleChronoQuiz); intervalleChronoQuiz = null; }
}

function afficherQuestionQuiz(){
  const q = quizQuestions[quizIndex];
  const sansChrono = cibleQuizId === 'carteCles' && modeTranquilleCles;
  const puces = quizResultats.map(r => `<div class="puce ${r ? 'faite' : 'ratee'}"></div>`).join('')
    + Array(quizQuestions.length - quizResultats.length).fill('<div class="puce"></div>').join('');
  const optionsMelangees = melanger(q.options);
  const estQuestionPortee = !!(q.portee || q.porteeDouble); // lecture de portée : on ne doit pas pouvoir deviner par la couleur
  const optionsHTML = optionsMelangees.map((opt, i) => {
    const classeCouleur = (opt.c && !estQuestionPortee) ? ' style="background:' + COULEURS_NOTES[opt.c] + ' !important;"' : '';
    return `<button class="quiz-opt" data-ok="${opt.ok}"${classeCouleur} onclick="repondreQuiz(this, ${opt.ok})">${opt.t}</button>`;
  }).join('');
  const portee = q.porteeDouble ? svgPorteeSequence(q.porteeDouble, -1, q.clef || 'sol', true).svg
    : (q.portee ? svgPortee(q.portee, q.clef || 'sol', true) : '');

  const chronoHTML = sansChrono ? '' : `
    <div class="quiz-chrono-piste"><div class="quiz-chrono-barre" id="quizChronoBarre" style="width:100%;"></div></div>
    <div class="quiz-chrono-nombre" id="quizChronoNombre">⏱️ ${DUREE_CHRONO_QUIZ} s</div>`;

  document.getElementById(cibleQuizId).innerHTML = `
    <div class="quiz-progression">${puces}</div>
    ${chronoHTML}
    ${portee}
    <div class="quiz-question">${q.texte}</div>
    <div class="quiz-options">${optionsHTML}</div>
    <div id="quizFeedback" class="quiz-feedback"></div>
    <div id="quizExplication" class="quiz-explication"></div>
    <div id="zoneSuivantQuiz"></div>`;

  const texteOptions = optionsMelangees.map(o => o.t).join(' ... ');
  const texteComplet = q.texte + ' ... ' + texteOptions;

  parlerAbel(texteComplet, sansChrono ? null : demarrerChronoQuiz, q.texte);
}

function demarrerChronoQuiz(){
  arreterChronoQuiz();
  let secondesRestantes = DUREE_CHRONO_QUIZ;
  const barre = document.getElementById('quizChronoBarre');
  const nombre = document.getElementById('quizChronoNombre');

  intervalleChronoQuiz = setInterval(() => {
    secondesRestantes--;
    if(barre) barre.style.width = (secondesRestantes / DUREE_CHRONO_QUIZ * 100) + '%';
    if(nombre) nombre.textContent = '⏱️ ' + Math.max(secondesRestantes, 0) + ' s';
    if(barre && secondesRestantes <= 3) barre.style.background = 'var(--rouge-non)';

    if(secondesRestantes <= 0){
      arreterChronoQuiz();
      expirationTempsQuiz();
    }
  }, 1000);
}

function expirationTempsQuiz(){
  const boutons = document.querySelectorAll('.quiz-opt');
  boutons.forEach(b => {
    b.disabled = true;
    if(b.dataset.ok === 'true') b.classList.add('bonne');
  });
  quizResultats.push(false);

  const feedback = document.getElementById('quizFeedback');
  if(feedback){
    feedback.textContent = '⏰ Temps écoulé';
    feedback.className = 'quiz-feedback non';
  }

  const phrasesTemps = ['Le temps est écoulé, on continue champion !', 'Trop tard cette fois, mais on progresse !', 'Presque, sois un peu plus rapide la prochaine fois champion !'];
  parlerAbel(phrasesTemps[Math.floor(Math.random()*phrasesTemps.length)]);

  const dernierQuestion = (quizIndex === quizQuestions.length - 1);
  const zoneSuivant = document.getElementById('zoneSuivantQuiz');
  if(zoneSuivant){
    zoneSuivant.innerHTML = `<button class="bouton-jeu" onclick="continuerQuiz()">${dernierQuestion ? '🏁 Voir mon score' : '▶️ Question suivante'}</button>`;
  }
}

function repondreQuiz(bouton, estBonne){
  arreterChronoQuiz();
  annulerVoixAbel();
  const q = quizQuestions[quizIndex];

  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if(b.dataset.ok === 'true') b.classList.add('bonne');
  });
  if(!estBonne) bouton.classList.add('mauvaise');
  if(estBonne){ quizScore++; etincelleAu(bouton); }
  quizResultats.push(estBonne);

  const feedback = document.getElementById('quizFeedback');
  if(feedback){
    feedback.textContent = estBonne ? '✅ Bonne réponse !' : '❌ Mauvaise réponse';
    feedback.className = 'quiz-feedback ' + (estBonne ? 'ok' : 'non');
  }

  // Pour les questions de lecture de portée, on explique où se trouve la note en cas d'erreur.
  const estQuestionAvecExplication = !estBonne && (q.portee || q.porteeDouble);
  let phraseExplication = '';
  if(estQuestionAvecExplication){
    phraseExplication = explicationPortee(q);
    phraseExplication = phraseExplication.charAt(0).toUpperCase() + phraseExplication.slice(1) + '.';
  }
  const explication = document.getElementById('quizExplication');
  if(explication){
    explication.textContent = estQuestionAvecExplication ? ('💡 ' + phraseExplication) : '';
    explication.className = 'quiz-explication' + (estQuestionAvecExplication ? ' visible' : '');
  }

  const phrasesOk = ['Bravo champion, c\'est exact !', 'Super champion, bien joué !', 'Oui, tout à fait champion !'];
  const phrasesNon = ['Presque champion, on continue !', 'Pas tout à fait, mais tu progresses champion !', 'On retient pour la prochaine fois, champion !'];

  let texteVoix = estBonne
    ? phrasesOk[Math.floor(Math.random()*phrasesOk.length)]
    : phrasesNon[Math.floor(Math.random()*phrasesNon.length)];

  if(!estBonne){
    const boutonCorrect = document.querySelector('.quiz-opt[data-ok="true"]');
    if(boutonCorrect) texteVoix += ' La bonne réponse était : ' + boutonCorrect.textContent + '.';
    if(estQuestionAvecExplication) texteVoix += ' ' + phraseExplication;
  }

  parlerAbel(texteVoix);

  const dernierQuestion = (quizIndex === quizQuestions.length - 1);
  document.getElementById('zoneSuivantQuiz').innerHTML =
    `<button class="bouton-jeu" onclick="continuerQuiz()">${dernierQuestion ? '🏁 Voir mon score' : '▶️ Question suivante'}</button>`;
}

function continuerQuiz(){
  arreterChronoQuiz();
  annulerVoixAbel();
  quizIndex++;
  if(quizIndex < quizQuestions.length) afficherQuestionQuiz();
  else afficherFinQuiz();
}

function afficherFinQuiz(){
  quizDemarre = false;
  const total = quizQuestions.length;
  let messageAbel;
  const nouveauRecord = quizScore > quizRecords[quizNiveau];
  if(nouveauRecord){
    quizRecords[quizNiveau] = quizScore;
    try{ localStorage.setItem('abel_quiz_records', JSON.stringify(quizRecords)); }catch(e){}
  }
  if(nouveauRecord && quizScore > 0) messageAbel = 'Bravo champion, nouveau record à ce niveau !';
  else if(quizScore === total) messageAbel = 'Parfait champion, tu connais déjà très bien tes notes !';
  else if(quizScore >= total/2) messageAbel = 'Bien joué champion, continue comme ça !';
  else messageAbel = 'On rejouera bientôt pour s\'entraîner encore, champion !';
  parlerAbel(messageAbel);
  if(quizNiveau === 'facile') debloquerBadge('quiz_facile');
  else if(quizNiveau === 'moyen') debloquerBadge('quiz_moyen');
  else if(quizNiveau === 'fort') debloquerBadge('quiz_fort');
  else if(quizNiveau.startsWith('cles_')) debloquerBadge('quiz_portee');

  document.getElementById(cibleQuizId).innerHTML = `
    <div class="quiz-fin">
      <p style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;">Quiz terminé ! (${LABELS_NIVEAU[quizNiveau]})</p>
      <div class="score">${quizScore} / ${total}</div>
      <p style="font-weight:700; color:${nouveauRecord ? '#ff9800' : 'var(--ink-soft)'}; font-size:13px;">
        ${nouveauRecord ? '🏆 Nouveau record !' : 'Record actuel : ' + quizRecords[quizNiveau] + ' / ' + total}
      </p>
      <button class="bouton-jeu" onclick="demarrerQuiz('${quizNiveau}')">🔁 Rejouer</button>
      <button class="bouton-jeu" style="background:#888;" onclick="${quizNiveau.startsWith('cles_') ? 'afficherAccueilCles()' : 'afficherAccueilQuiz()'}">↩️ Changer de niveau</button>
    </div>`;
}

/* ===================== PARTITIONS ===================== */
const CHANSONS = [
  { titre:"Au clair de la lune", notesDroite:['do','do','do','re','mi','re','do','mi','re','re','do'], notesGauche:[] },
  { titre:"Frère Jacques", notesDroite:['do','re','mi','do','do','re','mi','do','mi','fa','sol','mi','fa','sol'], notesGauche:[] },
  { titre:"La gamme qui monte", notesDroite:['do','re','mi','fa','sol','la','si'], notesGauche:[] },
  { titre:"Une souris verte", notesDroite:['sol','sol','sol','la','sol','fa','mi','do','re','mi'], notesGauche:[] },
  { titre:"Meunier tu dors", notesDroite:['do','do','fa','fa','la','la','sol','fa','mi','mi','re','re','do'], notesGauche:[] },
  { titre:"Au clair de la lune (main gauche)", notesDroite:[], notesGauche:['do','do','do','re','mi','re','do','mi','re','re','do'] },
  { titre:"Ainsi font font font", notesDroite:[], notesGauche:['sol','sol','sol','mi','mi','mi','la','la','sol','fa','mi','re','do','re','mi','fa','sol','sol','sol','mi','do'] },
  { titre:"Pomme de reinette (main gauche)", notesDroite:[], notesGauche:['do','re','mi','do','re','mi','sol','fa','mi','re','do'] },
  { titre:"Au clair de la lune (à deux mains)", notesDroite:['do','do','do','re','mi','re','do','mi','re','re','do'], notesGauche:['do','do','do','re','mi','re','do','mi','re','re','do'] },
  { titre:"Frère Jacques (à deux mains)", notesDroite:['do','re','mi','do','do','re','mi','do','mi','fa','sol','mi','fa','sol'], notesGauche:['do','re','mi','do','do','re','mi','do','mi','fa','sol','mi','fa','sol'] },
];
let partitionInitialisee = false, chansonActive = 0, curseurDroite = 0, curseurGauche = 0, demoEnCours = false;
let tempsDebutChanson = null;
let chansonRecords = {};
try{ chansonRecords = JSON.parse(localStorage.getItem('abel_chanson_records') || '{}'); }catch(e){}

function iconeChanson(c){
  if(c.notesDroite.length > 0 && c.notesGauche.length > 0) return '🎼';
  return c.notesGauche.length > 0 ? '✋' : '🖐️';
}

function initPartitions(){
  partitionInitialisee = true;
  const liste = document.getElementById('listeChansons');
  liste.innerHTML = CHANSONS.map((c, i) =>
    `<button class="chanson-btn ${i === 0 ? 'actif' : ''}" onclick="choisirChanson(${i})">${iconeChanson(c)} ${c.titre}</button>`
  ).join('');

  creerClavier('clavierPartitionA', (index, bouton) => {
    if(demoEnCours) return;
    const chanson = CHANSONS[chansonActive];
    if(chanson.notesDroite.length === 0) return;
    if(tempsDebutChanson === null) tempsDebutChanson = Date.now();
    jouerNote(NOTES[index].freq);
    flashTouche(bouton);
    if(index === indexParClasse(chanson.notesDroite[curseurDroite])){
      curseurDroite++;
      majAffichagePartition();
      verifierFinChanson(bouton);
    }
  });
  creerClavier('clavierPartitionB', (index, bouton) => {
    if(demoEnCours) return;
    const chanson = CHANSONS[chansonActive];
    if(chanson.notesGauche.length === 0) return;
    if(tempsDebutChanson === null) tempsDebutChanson = Date.now();
    jouerNote(BASS_NOTES[index].freq);
    flashTouche(bouton);
    if(index === indexParClasse(chanson.notesGauche[curseurGauche])){
      curseurGauche++;
      majAffichagePartition();
      verifierFinChanson(bouton);
    }
  });
  choisirChanson(0);
}

function afficherRecordChanson(){
  const titre = CHANSONS[chansonActive].titre;
  const record = chansonRecords[titre];
  document.getElementById('recordChansonActuelle').textContent = record
    ? '🏆 Record sur cette chanson : ' + record + ' s' : '';
}

function choisirChanson(i){
  chansonActive = i; curseurDroite = 0; curseurGauche = 0; tempsDebutChanson = null;
  document.querySelectorAll('.chanson-btn').forEach((b, idx) => b.classList.toggle('actif', idx === i));
  majAffichagePartition();
  afficherRecordChanson();
  const c = CHANSONS[i];
  const desc = (c.notesDroite.length > 0 && c.notesGauche.length > 0) ? 'à jouer avec les deux mains ensemble'
    : (c.notesGauche.length > 0 ? 'à jouer avec la main gauche, en clé de fa' : 'à jouer avec la main droite, en clé de sol');
  parlerAbel('Voici « ' + c.titre + ' », ' + desc + ' !');
}

function majUneMain(notes, curseur, sourceNotes, clef, idPortee, idLigne, idProgres, idClavier, idZone, labelMain){
  const zone = document.getElementById(idZone);
  if(notes.length === 0){ zone.classList.add('hidden'); return; }
  zone.classList.remove('hidden');

  document.getElementById(idProgres).textContent = labelMain + ' — Note ' + Math.min(curseur+1, notes.length) + ' / ' + notes.length;
  document.getElementById(idLigne).innerHTML = notes.map((classe, i) => {
    const note = sourceNotes[indexParClasse(classe)];
    let etat = '';
    if(i < curseur) etat = 'faite';
    else if(i === curseur) etat = 'courante';
    return `<div class="note-bulle ${classe} ${etat}">${note.nom}</div>`;
  }).join('');
  document.getElementById(idPortee).innerHTML = svgPorteeSequence(notes, curseur, clef).svg;

  document.querySelectorAll('#' + idClavier + ' .touche').forEach(b => b.classList.remove('cible'));
  if(curseur < notes.length){
    const idx = indexParClasse(notes[curseur]);
    const cible = document.querySelector('#' + idClavier + ' .touche[data-index="' + idx + '"]');
    if(cible) cible.classList.add('cible');
  }
}

function majAffichagePartition(){
  const chanson = CHANSONS[chansonActive];
  majUneMain(chanson.notesDroite, curseurDroite, NOTES, 'sol', 'zonePorteePartitionA', 'partitionLigneA', 'partitionProgresA', 'clavierPartitionA', 'zoneMainDroitePartition', '🖐️ Main droite');
  majUneMain(chanson.notesGauche, curseurGauche, BASS_NOTES, 'fa', 'zonePorteePartitionB', 'partitionLigneB', 'partitionProgresB', 'clavierPartitionB', 'zoneMainGauchePartition', '✋ Main gauche');
}

function verifierFinChanson(bouton){
  const chanson = CHANSONS[chansonActive];
  const finDroite = chanson.notesDroite.length === 0 || curseurDroite >= chanson.notesDroite.length;
  const finGauche = chanson.notesGauche.length === 0 || curseurGauche >= chanson.notesGauche.length;
  if(finDroite && finGauche){
    setTimeout(() => etincelleAu(bouton), 100);
    if(chanson.notesDroite.length > 0 && chanson.notesGauche.length > 0) debloquerBadge('duo');
    else if(chanson.notesGauche.length > 0) debloquerBadge('chanson_gauche');
    else debloquerBadge('chanson_droite');

    if(tempsDebutChanson !== null){
      const temps = Math.round((Date.now() - tempsDebutChanson) / 1000);
      const ancienRecord = chansonRecords[chanson.titre];
      if(!ancienRecord || temps < ancienRecord){
        chansonRecords[chanson.titre] = temps;
        try{ localStorage.setItem('abel_chanson_records', JSON.stringify(chansonRecords)); }catch(e){}
        parlerAbel('Bravo champion, nouveau record : ' + temps + ' secondes !');
      } else {
        parlerAbel('Bravo champion, tu as joué toute la chanson !');
      }
      afficherRecordChanson();
      tempsDebutChanson = null;
    }
  }
}

function jouerDemoChanson(){
  if(demoEnCours) return;
  demoEnCours = true;
  parlerAbel('Écoute bien...');
  const chanson = CHANSONS[chansonActive];
  const boutonsA = document.querySelectorAll('#clavierPartitionA .touche');
  const boutonsB = document.querySelectorAll('#clavierPartitionB .touche');
  const longueur = Math.max(chanson.notesDroite.length, chanson.notesGauche.length);
  let i = 0;
  const intervalle = setInterval(() => {
    if(i < chanson.notesDroite.length){
      const idx = indexParClasse(chanson.notesDroite[i]);
      jouerNote(NOTES[idx].freq);
      flashTouche(boutonsA[idx]);
    }
    if(i < chanson.notesGauche.length){
      const idx = indexParClasse(chanson.notesGauche[i]);
      jouerNote(BASS_NOTES[idx].freq);
      flashTouche(boutonsB[idx]);
    }
    if(chanson.notesDroite.length > 0) document.getElementById('zonePorteePartitionA').innerHTML = svgPorteeSequence(chanson.notesDroite, i, 'sol').svg;
    if(chanson.notesGauche.length > 0) document.getElementById('zonePorteePartitionB').innerHTML = svgPorteeSequence(chanson.notesGauche, i, 'fa').svg;
    i++;
    if(i >= longueur){
      clearInterval(intervalle);
      setTimeout(() => { demoEnCours = false; majAffichagePartition(); parlerAbel('À toi de jouer maintenant !'); }, 500);
    }
  }, 750);
}

/* ===================== DATE DU JOUR ===================== */
function afficherDateJour(){
  const el = document.getElementById('dateJour');
  if(!el) return;
  const maintenant = new Date();
  const texte = maintenant.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  el.textContent = texte.charAt(0).toUpperCase() + texte.slice(1);
}
afficherDateJour();
setInterval(afficherDateJour, 60000);

/* ===================== INITIALISATION DE L'ONGLET PAR DÉFAUT (QUIZ) ===================== */
afficherAccueilQuiz();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

/* ===================== ÉCRAN D'OUVERTURE ===================== */
(function(){
  const splash = document.getElementById('splashIntro');
  if(!splash) return;
  let termine = false;

  function terminerSplash(){
    if(termine) return;
    termine = true;
    splash.classList.add('masque');
    setTimeout(() => { if(splash.parentNode) splash.parentNode.removeChild(splash); }, 550);
  }

  // Petite mélodie de bienvenue, synchronisée avec l'animation des touches
  setTimeout(() => jouerNote(NOTES[0].freq), 1050);
  setTimeout(() => jouerNote(NOTES[2].freq), 1200);
  setTimeout(() => jouerNote(NOTES[4].freq), 1350);
  setTimeout(() => jouerNote(NOTES[0].freq), 1550);

  // Barre de progression et pourcentage, de 0% à 100%
  const barreFill = document.getElementById('splashBarreFill');
  const pourcentageEl = document.getElementById('splashPourcentage');
  const dureeChargement = 2250;
  setTimeout(() => {
    const debut = performance.now();
    function animerChargement(t){
      if(termine) return;
      const progres = Math.min(1, (t - debut) / dureeChargement);
      const pourcentage = Math.round(progres * 100);
      if(barreFill) barreFill.style.width = pourcentage + '%';
      if(pourcentageEl) pourcentageEl.textContent = pourcentage + '%';
      if(progres < 1) requestAnimationFrame(animerChargement);
    }
    requestAnimationFrame(animerChargement);
  }, 850);

  splash.addEventListener('click', terminerSplash);
})();


</script>
